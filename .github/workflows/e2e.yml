name: e2e

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Cancel superseded in-flight runs for the same PR/branch, but never cancel a
# push/tag run — those can reach the release job, and cancelling mid-publish
# could leave a partial multi-arch image manifest.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # ubuntu-24.04 runners are real VMs with cgroup v2, a modern kernel, sudo,
    # OpenSSL-linked curl, and outbound network — everything the agent needs.
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Generate BPF bindings and build
        run: |
          go generate ./...
          go mod tidy
          go build -trimpath -o bin/ebfw .

      - name: Unit tests
        # The controller package needs envtest binaries; it is covered by the
        # operator-test job. Everything else (incl. the policy aggregation +
        # CRD conversion tests) runs here.
        run: go test $(go list ./... | grep -v 'ebfw/internal/controller')

      - name: End-to-end test (eBPF; needs root)
        run: sudo ./test/e2e.sh bin/ebfw

  operator-test:
    # Control-plane tests: CRD codegen + the controllers under envtest. Pure Go,
    # no eBPF and no root, so this is the fast feedback loop for the operator.
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Operator tests (controller-gen + envtest)
        run: make test-operator

  crd-e2e:
    # Stage-3 CRD e2e: installs the Helm chart (CRDs + operator + agent watching
    # the CRDs in enforce mode) and asserts operator status, CRD-driven denies,
    # the namespaced default-deny semantic, and ClusterEgressPolicy node-wide deny.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d + helm
        # kubectl and jq are preinstalled on ubuntu-24.04 runners.
        run: |
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | sudo bash
          curl -sfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash

      - name: CRD e2e (k3d + Helm)
        run: ./test/crd.sh

  build:
    # Build each (image, platform) on a NATIVE runner and push by digest — no
    # QEMU. The old single-runner build emulated linux/arm64 on amd64, and the
    # agent (clang BPF compile + Go build under emulation) took 50+ min; arm64
    # standard runners (ubuntu-24.04-arm, GA on private repos since 2026-01)
    # cut that to native speed. Each leg pushes an untagged manifest by digest;
    # the `merge` job assembles the multi-arch tag list from those digests.
    needs: [e2e, operator-test, crd-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ebfw
            dockerfile: Dockerfile
          - name: ebfw-operator
            dockerfile: Dockerfile.operator
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare platform pair
        # "linux/arm64" -> "linux-arm64", for a filesystem-safe artifact name.
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-platform manifest, no tag, addressed only by digest. Disable
          # provenance/SBOM so each digest is a plain image manifest — keeps the
          # imagetools merge a clean 2-entry index (no unknown/unknown attestations).
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Assemble the per-platform digests into one multi-arch tag list per image
    # and push. Runs once the four build legs (2 images x 2 platforms) succeed.
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ebfw, ebfw-operator]
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          # Anchor on the platform prefix. `digests-ebfw-*` would ALSO match the
          # `digests-ebfw-operator-*` artifacts (ebfw is a prefix of ebfw-operator),
          # mixing operator digests into the ebfw manifest -> imagetools "not found".
          # Platforms are always linux/*, so `-linux-*` is the unambiguous boundary.
          pattern: digests-${{ matrix.image }}-linux-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
