name: e2e

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    # ubuntu-24.04 runners are real VMs with cgroup v2, a modern kernel, sudo,
    # OpenSSL-linked curl, and outbound network — everything the agent needs.
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Generate BPF bindings and build
        run: |
          go generate ./...
          go mod tidy
          go build -trimpath -o bin/ebfw .

      - name: Unit tests
        run: go test ./...

      - name: End-to-end test (eBPF; needs root)
        run: sudo ./test/e2e.sh bin/ebfw

  k8s:
    # Full Kubernetes e2e: deploy to a throwaway k3d cluster and assert pod
    # attribution (DNS/TLS/HTTP/HTTPS), metrics, and JSON output. The image is
    # built inside Docker by the script, so no Go/clang toolchain is needed here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        # kubectl and jq are preinstalled on ubuntu-24.04 runners.
        run: curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | sudo bash

      - name: Kubernetes e2e (k3d)
        run: ./test/k8s.sh
