# Merge patch over the ebfw-config ConfigMap to enable a SAFE enforcement demo.
#
#   kubectl -n ebfw patch configmap ebfw-config --type merge --patch-file deploy/demo-enforce.patch.yaml
#   kubectl -n ebfw rollout restart ds/ebfw
#
# Enforcement attaches at the node root cgroup, so it is NODE-WIDE. This demo is
# a blocklist (defaultAction: Allow) that only denies destinations the node and
# cluster do not need — everything else (kube-dns, the API server, image pulls)
# keeps working. Do NOT use defaultAction: Deny here, or you will cut the node off.
data:
  enforce-mode: "enforce"
  policy.yaml: |
    defaultAction: Allow
    rules:
      - name: demo-deny-example-domains   # domain blocking via DNS→IP learning
        action: Deny
        match:
          domains: ["example.com", "*.example.com", "example.net"]
      - name: demo-deny-1.1.1.0/24        # CIDR blocking (e.g. 1.1.1.1)
        action: Deny
        match:
          cidrs: ["1.1.1.0/24"]
