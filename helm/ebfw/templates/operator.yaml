{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ebfw.operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebfw.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ebfw.operator.fullname" . }}
  labels:
    {{- include "ebfw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ebfw.dvrkn.com"]
    resources: ["egresspolicies", "clusteregresspolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ebfw.dvrkn.com"]
    resources: ["egresspolicies/status", "clusteregresspolicies/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ebfw.operator.fullname" . }}
  labels:
    {{- include "ebfw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ebfw.operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ebfw.operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.operator.leaderElect }}
---
# Leader-election lease in the operator's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ebfw.operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebfw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ebfw.operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebfw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ebfw.operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "ebfw.operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebfw.operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebfw.labels" . | nindent 4 }}
    {{- include "ebfw.operator.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "ebfw.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ebfw.operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ebfw.operator.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "ebfw.operator.image" . | quote }}
          imagePullPolicy: {{ include "ebfw.operator.pullPolicy" . }}
          args:
            - --health-probe-bind-address=:8081
            {{- if .Values.operator.leaderElect }}
            - --leader-elect
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
