# This rule is not used by the project kb itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ebfw.dvrkn.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kb
    app.kubernetes.io/managed-by: kustomize
  name: egresspolicy-editor-role
rules:
- apiGroups:
  - ebfw.dvrkn.com
  resources:
  - egresspolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ebfw.dvrkn.com
  resources:
  - egresspolicies/status
  verbs:
  - get
