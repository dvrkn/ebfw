apiVersion: ebfw.dvrkn.com/v1
kind: EgressPolicy
metadata:
  name: allow-github
  namespace: default
spec:
  # podSelector is required; it scopes this whole policy to a subset of the
  # namespace's pods. Use {} to govern EVERY pod in the namespace. Here only pods
  # labeled app=frontend are governed: the rules below AND the defaultAction: Deny
  # apply only to them — other pods in `default` are untouched.
  podSelector:
    matchLabels:
      app: frontend
  # Allowlist for the selected pods: deny by default, allow only the rules below.
  # defaultAction: Deny here default-denies ONLY the selected pods in this
  # namespace — never the whole node (that requires a ClusterEgressPolicy).
  defaultAction: Deny
  rules:
    - name: allow-dns
      action: Allow
      match:
        ports: [53]
    - name: allow-github
      action: Allow
      match:
        domains: ["github.com", "*.githubusercontent.com", "*.github.io"]
        ports: [443]
    - name: block-smtp
      action: Deny
      match:
        ports: [25, 465, 587]
